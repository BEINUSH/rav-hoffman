<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎨 הלוח של נועה</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>🎨 הלוח של נועה ✨</h1>
  </header>

  <div id="app">

    <!-- Toolbar -->
    <aside id="toolbar">

      <section class="tool-group">
        <h3>כלים</h3>
        <div class="tools-grid">
          <button class="tool-btn active" id="tool-pencil"       title="עיפרון"       data-tool="pencil">✏️</button>
          <button class="tool-btn" id="tool-brush"               title="מברשת"        data-tool="brush">🖌️</button>
          <button class="tool-btn" id="tool-spray"               title="ספריי"         data-tool="spray">💨</button>
          <button class="tool-btn" id="tool-rainbow"             title="קשת צבעים"    data-tool="rainbow">🌈</button>
          <button class="tool-btn" id="tool-line"                title="קו ישר"        data-tool="line">📏</button>
          <button class="tool-btn" id="tool-rect"                title="מלבן מסגרת"   data-tool="rect">⬜</button>
          <button class="tool-btn" id="tool-filled-rect"         title="מלבן מלא"     data-tool="filled-rect">🟥</button>
          <button class="tool-btn" id="tool-circle"              title="עיגול מסגרת"  data-tool="circle">⭕</button>
          <button class="tool-btn" id="tool-filled-circle"       title="עיגול מלא"    data-tool="filled-circle">🔴</button>
          <button class="tool-btn" id="tool-fill"                title="מילוי"         data-tool="fill">🪣</button>
          <button class="tool-btn" id="tool-star"                title="כוכב"          data-tool="star">⭐</button>
          <button class="tool-btn" id="tool-heart"               title="לב"            data-tool="heart">❤️</button>
          <button class="tool-btn" id="tool-text"                title="כתב"           data-tool="text">🔤</button>
          <button class="tool-btn eraser-btn" id="tool-eraser"   title="מחק"           data-tool="eraser">🧹</button>
        </div>
      </section>

      <section class="tool-group">
        <h3>גודל מהיר</h3>
        <div class="size-presets">
          <button class="size-btn" data-size="3">XS</button>
          <button class="size-btn" data-size="8">S</button>
          <button class="size-btn active" data-size="16">M</button>
          <button class="size-btn" data-size="32">L</button>
          <button class="size-btn" data-size="60">XL</button>
        </div>
      </section>

      <section class="tool-group">
        <h3>צבעים</h3>
        <div id="color-palette">
          <div class="swatch" style="background:#000000" data-color="#000000"></div>
          <div class="swatch" style="background:#ffffff; border:2px solid #ccc" data-color="#ffffff"></div>
          <div class="swatch" style="background:#e74c3c" data-color="#e74c3c"></div>
          <div class="swatch" style="background:#e67e22" data-color="#e67e22"></div>
          <div class="swatch" style="background:#f1c40f" data-color="#f1c40f"></div>
          <div class="swatch" style="background:#2ecc71" data-color="#2ecc71"></div>
          <div class="swatch" style="background:#1abc9c" data-color="#1abc9c"></div>
          <div class="swatch" style="background:#3498db" data-color="#3498db"></div>
          <div class="swatch" style="background:#9b59b6" data-color="#9b59b6"></div>
          <div class="swatch" style="background:#e91e63" data-color="#e91e63"></div>
          <div class="swatch" style="background:#ff9800" data-color="#ff9800"></div>
          <div class="swatch" style="background:#8bc34a" data-color="#8bc34a"></div>
          <div class="swatch" style="background:#00bcd4" data-color="#00bcd4"></div>
          <div class="swatch" style="background:#673ab7" data-color="#673ab7"></div>
          <div class="swatch" style="background:#795548" data-color="#795548"></div>
          <div class="swatch" style="background:#9e9e9e" data-color="#9e9e9e"></div>
          <div class="swatch" style="background:#ff6b9d" data-color="#ff6b9d"></div>
          <div class="swatch" style="background:#c8e6c9" data-color="#c8e6c9"></div>
        </div>
        <div id="color-row">
          <label>
            <span>צבע מותאם:</span>
            <input type="color" id="color-picker" value="#e74c3c" />
          </label>
        </div>
        <div id="color-preview-row">
          <div id="color-preview"></div>
          <span id="color-hex">#e74c3c</span>
        </div>
      </section>

      <section class="tool-group">
        <h3>גודל מברשת</h3>
        <input type="range" id="brush-size" min="1" max="80" value="16" />
        <div id="brush-preview-wrap">
          <canvas id="brush-preview" width="80" height="80"></canvas>
        </div>
      </section>

      <section class="tool-group">
        <h3>שקיפות</h3>
        <input type="range" id="opacity-slider" min="5" max="100" value="100" />
        <span id="opacity-label">100%</span>
      </section>

      <section class="tool-group eraser-section">
        <button id="btn-big-eraser" class="big-eraser-btn">🧹 מחק</button>
      </section>

      <section class="tool-group actions">
        <div class="undo-redo-row">
          <button id="btn-undo"  class="action-btn half">↩️ בטל</button>
          <button id="btn-redo"  class="action-btn half">↪️ חזור</button>
        </div>
        <button id="btn-clear" class="action-btn danger">🗑️ נקה הכל</button>
        <button id="btn-save"  class="action-btn success">💾 שמור ציור</button>
        <button id="btn-bg"    class="action-btn">🖼️ צבע רקע</button>
        <input  type="color" id="bg-color-picker" value="#ffffff" style="display:none" />
      </section>

    </aside>

    <!-- Canvas area -->
    <main id="canvas-wrap">
      <canvas id="drawing-canvas"></canvas>
      <canvas id="preview-canvas"></canvas>
    </main>

  </div>

  <!-- Notification -->
  <div id="notification"></div>

  <script src="app.js"></script>
</body>
</html>
